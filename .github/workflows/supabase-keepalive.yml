name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 6 1,6,11,16,21,26,31 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query products table
        run: |
          code=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://ulbkppeuoktitvzhomnr.supabase.co/rest/v1/products?select=id&limit=1")
          echo "HTTP $code"
          cat /tmp/res.json
          if [ "$code" != "200" ]; then exit 1; fi
